name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'NPM dist-tag (es. latest, beta, next)'
        required: true
        default: 'latest'
        type: string
      dry_run:
        description: 'Simula la pubblicazione senza caricare su npm (dry run)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build, Test & Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Build project
        run: npm run build

      - name: Publish to npm (Dry Run)
        if: ${{ github.event.inputs.dry_run == 'true' || github.event.inputs.dry_run == true }}
        run: npm publish --access public --tag ${{ github.event.inputs.tag || 'latest' }} --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (Live)
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.dry_run != true }}
        run: npm publish --access public --tag ${{ github.event.inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
